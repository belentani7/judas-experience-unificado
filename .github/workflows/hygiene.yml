name: hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detectar marcadores de conflicto
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- . ; then
            echo "Marcadores de conflicto detectados"
            exit 1
          fi
